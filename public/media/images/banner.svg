<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="40%" stop-color="#0f2b48"/>
      <stop offset="70%" stop-color="#0d3b66"/>
      <stop offset="100%" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Network Connection Beams -->
  <g opacity="0.35">
    <path d="M-100 500 Q 400 150 960 300 T 2020 100" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6"/>
    <path d="M-50 200 Q 500 450 1100 250 T 2000 400" fill="none" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4"/>
    <path d="M200 650 Q 800 200 1400 350 T 2100 150" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.3"/>
  </g>

  <!-- Glowing Abstract Network Nodes -->
  <g fill="#00f2fe" opacity="0.6">
    <circle cx="320" cy="220" r="4"/>
    <circle cx="480" cy="180" r="3"/>
    <circle cx="750" cy="270" r="5"/>
    <circle cx="960" cy="300" r="6"/>
    <circle cx="1200" cy="260" r="4"/>
    <circle cx="1450" cy="360" r="5"/>
    <circle cx="1680" cy="220" r="3"/>
  </g>

  <!-- Security Shield & VPN Brand Centerpiece -->
  <g transform="translate(960, 260)">
    <!-- Outer Shield Glow -->
    <path d="M 0 -110 L 85 -60 L 85 45 C 85 105 0 145 0 145 C 0 145 -85 105 -85 45 L -85 -60 Z" 
          fill="url(#glowGrad)" stroke="url(#accentGrad)" stroke-width="3" filter="drop-shadow(0 0 20px rgba(0,242,254,0.4))"/>
    
    <!-- Inner Lock & Tunnel -->
    <path d="M -24 -10 C -24 -28 24 -28 24 -10 L 24 15 L -24 15 Z" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
    <rect x="-32" y="12" width="64" height="46" rx="8" fill="#00f2fe" opacity="0.9"/>
    <circle cx="0" cy="30" r="5" fill="#0a192f"/>
    <path d="M 0 35 L 0 45" stroke="#0a192f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="960" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="4">
    URBAN<tspan fill="#00f2fe">VPN</tspan>
  </text>
  <text x="960" y="515" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" fill="#94a3b8" letter-spacing="3">
    NEXT-GENERATION ENCRYPTED TUNNELS &amp; DIGITAL FREEDOM
  </text>
</svg>
